<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>COWON A2 — TE BENCH V3</title>
<style>
:root{
  --bench:#E4E4E0; --grid:#D2D2CD; --ink:#111; --dim:#7A7A75; --org:#FF6A1F; --cya:#7FB0D8; --lim:#8CCBA6;
  --mono:"SF Mono","JetBrains Mono","DejaVu Sans Mono",Menlo,Consolas,"Liberation Mono",monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bench);color:var(--ink);font:11px/1.55 var(--mono);text-transform:uppercase;letter-spacing:.02em}
body{
  min-height:100vh;
  background-image:url("data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='24' height='24'%3E%3Cpath d='M23.5 0V24M0 23.5H24' stroke='%23D2D2CD' fill='none'/%3E%3C/svg%3E");
}
.top{display:flex;justify-content:space-between;gap:16px;padding:10px 16px;border-bottom:1px solid var(--ink);background:var(--bench)}
.top b{font-weight:700}
.top i{display:inline-block;width:8px;height:8px;background:var(--org);margin-right:8px;vertical-align:baseline}
#bench{display:flex;justify-content:center;padding:20px 16px 0}
#fit{position:relative}
#rig{position:absolute;left:0;top:0;transform-origin:0 0}
#rig>*{position:absolute}
#glass{background:#000}
#lcd{background:#000;image-rendering:auto}
#chassis{left:0;top:0;user-select:none;-webkit-user-drag:none;pointer-events:none}
.hs{background:transparent;border:0;outline:0;cursor:pointer;touch-action:none;-webkit-tap-highlight-color:transparent}
button.hs.down{background:rgba(0,0,0,.34)}
#stick{left:0;top:0;overflow:visible;touch-action:none}
#stick .hs{fill:rgba(0,0,0,0);cursor:pointer;touch-action:none}
#stick .hs.down{fill:rgba(0,0,0,.32)}
.dot{position:absolute;left:9px;top:50%;width:6px;height:6px;margin-top:-3px;border-radius:50%;pointer-events:none}
.dot.A{background:var(--org)} .dot.B{background:var(--cya)} .dot.C{background:var(--lim)}
#led{border-radius:50%;pointer-events:none}
/* power slide (right edge) */
#pwr{background:#151515;border:1px solid #000;cursor:pointer;touch-action:none}
#pwr .slot{position:absolute;left:5px;top:20px;width:6px;height:36px;background:#000;border:1px solid #4a4a4a}
#pwr .knob{position:absolute;left:-1px;width:6px;height:16px;background:#ECECEC;transition:top 90ms steps(3,end)}
#pwr[aria-checked="true"] .knob{top:1px;border-top:3px solid var(--org)}
#pwr[aria-checked="false"] .knob{top:17px;border-top:0}
#pwr .glyph{position:absolute;left:4px;top:5px;width:8px;height:8px;border:1px solid #ECECEC;border-radius:50%;border-top-color:transparent}
#pwr .glyph:after{content:"";position:absolute;left:2.5px;top:-4px;width:1px;height:5px;background:#ECECEC}
.cap{font-size:7px;line-height:1;letter-spacing:.08em;color:var(--ink);pointer-events:none;white-space:nowrap}
/* 3-way slide (bottom edge) */
#sw{touch-action:none;cursor:pointer}
#sw .track{position:absolute;left:0;top:0;width:150px;height:16px;background:#151515;border:1px solid #000}
#sw .knob{position:absolute;left:2px;top:2px;width:44px;height:10px;background:#ECECEC;transition:transform 90ms steps(4,end)}
#sw .knob:before,#sw .knob:after{content:"";position:absolute;top:2px;bottom:2px;width:1px;background:#8a8a85}
#sw .knob:before{left:17px}#sw .knob:after{left:26px}
#sw .lab{position:absolute;top:20px;font-size:7px;line-height:1;letter-spacing:.08em;white-space:nowrap}
#sw .lab.on{color:var(--org);font-weight:700}
#sw .tick{position:absolute;top:17px;width:1px;height:3px;background:var(--ink)}
.legend{max-width:860px;margin:10px auto 0;padding:0 16px;color:var(--dim);font-size:10px;text-align:center}
.legend b{color:var(--ink);font-weight:700}
#notes{max-width:860px;margin:28px auto 60px;padding:0 16px}
#notes h2{font-size:11px;font-weight:700;border-top:1px solid var(--ink);padding-top:8px;margin-bottom:12px}
#notes h3{font-size:10px;font-weight:700;margin:18px 0 6px;color:var(--ink)}
#notes h3:before{content:"";display:inline-block;width:8px;height:8px;background:var(--org);margin-right:8px}
#notes p,#notes li{color:#333;font-size:10px;line-height:1.7;text-transform:none;letter-spacing:0}
#notes ul{list-style:none}
#notes li:before{content:"— ";color:var(--dim)}
#notes table{border-collapse:collapse;width:100%;font-size:10px;margin:4px 0}
#notes th,#notes td{border:1px solid var(--ink);padding:3px 8px;text-align:left;font-weight:400;background:var(--bench)}
#notes th{font-weight:700}
#notes pre{font:10px/1.6 var(--mono);background:var(--bench);border:1px solid var(--ink);padding:8px 10px;overflow:auto;text-transform:none;letter-spacing:0}
@media (max-width:640px){.top span:nth-child(2){display:none}}
</style>

const NOTES_HTML = `<h2>FIELD NOTES // V3 — HARMONIZED BUILD</h2>
<h3>WHAT THIS IS</h3>
<p>The live demo is the paint on the canvas. It will be ported twice: onto the real A2, and into a native PC/Mac emulator that uses modern hardware. This build merges the v2 instrument with the second pass that added a video transport, JetEffect bench, library, diagnostics, power budget and USB. Features that the A2 hardware probably cannot do stay in as the PC-emulator side of the vision, and the RANK screen says so with numbers.</p>
<h3>RANK: THE PERCENTAGE SYSTEM</h3>
<p>Every feature has two scores: how likely it ports to the A2 hardware, and how likely it ports to a native PC/Mac emulator. KEEP means both are 70 or above. PROBE is promising but needs the plugin to find out. PC-ONLY is below 35 on the A2 and 60 or more on the PC. DROP is below 35 on both. These are estimates made before any diagnostics; the A2 column is re-scored once the plugin has talked to the real unit.</p>
<h3>STRUCTURE — 24 MODES, 3 PAGES OF 8</h3>
<ul><li>Page 1 is PLAY: music, player, photo, movie, radio, av, record, loop.</li>
<li>Page 2 is BENCH: sound, jet, signal, instrument, generator, library, session, browser.</li>
<li>Page 3 is SYSTEM: diag, power, usb, status, time, text, utility, rank.</li>
<li>The order changed on purpose. A 2006 PMP is a video player first. Your MOVIE screen is a beautiful spectrum toy, but the mode that was actually missing is a transport.</li>
<li>One persistent status line, HOLD BACK to SOUND, one screen one job: all kept.</li></ul>
<h3>NEW IN V3</h3>
<table>
<tr><th>MODE</th><th>WHAT IT DOES</th></tr>
<tr><td>PLAYER</td><td>DivX / XviD / WMV9 transport to 720x576: chapters, A-B, buffer model, dropped frames, aspect, NTSC/PAL, composite state. The clock and transport are real; the picture is a slate.</td></tr>
<tr><td>JET</td><td>JetEffect proper: 5-band EQ curve, BBE, Mach3Bass, MP Enhance, 3D Surround, 7 presets, insert-delta measurement. SOUND is the patchbay now; JET is the tuning bench.</td></tr>
<tr><td>LIBRARY</td><td>Index over the live engine tracks and your own recordings. Filter, sort, stats, HDD maths. No fake catalogue.</td></tr>
<tr><td>DIAG</td><td>Self-test ledger: panel patterns, key capture, real audio loopback through the master bus, a memory-proxy HDD burst, RTC drift, enumeration, pack voltage. Skips are skips, not passes.</td></tr>
<tr><td>POWER</td><td>4300mAh budget that reacts to what you are doing: backlight, SoC, HDD, 32mW+32mW amp, speakers, FM, VBUS. Projected runtime against the 18h audio / 10h video claim.</td></tr>
<tr><td>USB</td><td>Both roles at once: MSC device to a PC, host to a camera or a stick. VBUS cost, classes, copy, CRC32 window, event log. Host copies land in BROWSER.</td></tr>
<tr><td>RANK</td><td>Feasibility percentage for the A2 and for the PC/Mac emulator, per feature, with a verdict. Sorted best first.</td></tr>
</table>
<h3>LOW A2 SCORES — KEPT FOR THE PC SIDE</h3>
<ul><li>No video input. The A2 has composite OUT through its 3.5mm AV jack. There is no video ADC behind it. AV capture was a fiction; it is now frame grab from the decoder, which is a plausible patch.</li>
<li>No SD / MMC slot. The 1.8in hard disk is the storage, 20 or 30GB. Capacity maths now assume that.</li>
<li>No 24-bit / 96k path. Decode is 16/44.1. F32 is a Web Audio artifact, not a hardware feature.</li>
<li>No USB audio, no MIDI, no hub. The 2006 host stack is mass storage and PTP.</li></ul>
<h3>STILL SIMULATED, ON PURPOSE</h3>
<ul><li>Video pixels, FM stations, USB speed, HDD timing, pack voltage. Labelled wherever they appear.</li>
<li>3D Surround and MP Enhance are approximations: a Haas pair and a presence shelf. The real ones are proprietary fixed point.</li>
<li>Recordings live in memory and clear on reload. Download WAV to keep them.</li></ul>
<h3>THE PLUGIN PLAN, IN ONE LINE</h3>
<p>Mass storage is the channel. Patch the firmware to read /SYSTEM/CMD.TXT at boot and write /SYSTEM/LOG.TXT back, and you have a bidirectional RPC over plain USB with no driver work on either side. Everything else - EQ coefficient tables, OSD reads, key injection, screenshots - hangs off that.</p>
<h3>READING ORDER</h3>
<ul><li>RANK first, then the plugin plan above. Nothing is dropped from the demo until the diagnostics say so.</li></ul>`;

      G.text(o.v, 364, y + 9, on ? '#000' : vc(o.v), { size: 6, bold: true, align: 'right' });
      G.text('A2', 12, y + 20, on ? '#000' : COL.dim, { size: 6 }); G.box(26, y + 14, 120, 6, on ? '#000' : COL.dim); G.fill(26, y + 14, 120 * o.a / 100, 6, on ? '#000' : COL.C); G.text(o.a + '%', 150, y + 20, tc, { size: 6 });
      G.text('PC', 188, y + 20, on ? '#000' : COL.dim, { size: 6 }); G.box(202, y + 14, 120, 6, on ? '#000' : COL.dim); G.fill(202, y + 14, 120 * o.p / 100, 6, on ? '#000' : COL.B); G.text(o.p + '%', 326, y + 20, tc, { size: 6 });
    }
    if (R.length > vis) { G.vl(372, 22, 168, COL.faint); const h = Math.max(8, 168 * vis / R.length); G.fill(371, 22 + (168 - h) * this.sel / Math.max(1, R.length - 1), 3, h, COL.fg); }
    const s = R[this.sel];
    if (s) { G.text(s.area + ' · SCORE ' + s.score, 8, 204, COL.fg, { size: 7, bold: true }); G.text(s.note, 8, 216, COL.dim, { size: 7 }); }
    G.text('KEEP BOTH>=70  PROBE NEEDS THE PLUGIN  PC-ONLY A2<35  DROP BOTH<35', 8, 236, COL.dim, { size: 6 });
    G.text('PRE-DIAGNOSTIC ESTIMATES. THE A2 COLUMN IS RE-SCORED AFTER DIAGNOSTICS.', 8, 246, COL.faint, { size: 6 });
    rail({ up: 'UP', down: 'DOWN', left: 'FILTER-', right: 'FILTER+', ok: null, back: 'HOME', a: null, b: null, c: null, vol: false });
  },
};

/* ---- router ---- */
const Screens = {
  list: { launcher: Launcher, music: Music, player: Player, photo: Photo, movie: Movie, radio: Radio, av: AV, record: Record, loop: Loop, sound: Sound, jet: Jet, signal: Signal, instrument: Instrument, generator: Generator, library: Lib, session: Session, browser: Browser, diag: Diag, power: Power, usb: Usb, status: Status, time: Time, text: Text, utility: Utility, audit: Audit },
  cur: null, ret: null,
  go(id) { if (this.cur && this.cur.leave) this.cur.leave(); if (id !== 'sound') this.ret = id === 'launcher' ? null : this.ret; this.cur = this.list[id]; if (this.cur.enter) this.cur.enter(); },
  back() { if (this.cur.id === 'sound' && this.ret) { const r = this.ret; this.ret = null; this.go(r); } else { this.ret = null; this.go('launcher'); } },
};

/* =====================================================================
   BOOT
   ===================================================================== */
buildHardware(); wirePointers(); fit(); setSwitch('LCD'); Screens.go('launcher'); Dev.bootAt = performance.now();
window.addEventListener('resize', fit);
// browsers block audio until a gesture: arm it on the first one, anywhere on the page
['pointerdown', 'keydown', 'touchend'].forEach(ev => window.addEventListener(ev, () => Engine.ensure(), { once: false, passive: true }));
requestAnimationFrame(frame);
// test hook, harmless in normal use
window.__a2 = {
  X, Engine, Screens, Dev, press, release, setSwitch, setPower, Keys, Player, Jet, Lib, Diag, PW, Usb, Audit,
  selfTest() {
    const out = [], ids = Object.keys(Screens.list).filter(k => k !== 'launcher');
    ids.forEach(id => {
      try { Screens.go(id); const s = Screens.cur; if (s.draw) s.draw(Engine.A, 0.016, 1); out.push('PASS ' + id); }
      catch (e) { out.push('FAIL ' + id + ' :: ' + (e && e.message)); }
    });
    try { Screens.go('launcher'); Screens.cur.draw(Engine.A, 0.016, 1); out.push('PASS launcher'); } catch (e) { out.push('FAIL launcher :: ' + (e && e.message)); }
    return out;
  },
};
if (location.hash === '#selftest') setTimeout(() => {
  const r = window.__a2.selfTest(), bad = r.filter(x => x.slice(0, 4) === 'FAIL').length;
  document.title = 'SELFTEST ' + (bad ? bad + ' FAIL' : 'ALL PASS');
  const p = document.createElement('pre'); p.id = 'selftest'; p.textContent = r.join('\n'); document.body.appendChild(p);
}, 1400);

document.getElementById('notes').innerHTML = NOTES_HTML;
