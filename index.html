<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>COWON A2 — TE BENCH</title>
<style>
:root{
  --bench:#E4E4E0; --grid:#D2D2CD; --ink:#111; --dim:#7A7A75; --org:#FF5A00; --cya:#00E5FF; --lim:#76FF03;
  --mono:"SF Mono","JetBrains Mono","DejaVu Sans Mono",Menlo,Consolas,"Liberation Mono",monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bench);color:var(--ink);font:11px/1.55 var(--mono);text-transform:uppercase;letter-spacing:.02em}
body{
  min-height:100vh;
  background-image:url("data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='24' height='24'%3E%3Cpath d='M23.5 0V24M0 23.5H24' stroke='%23D2D2CD' fill='none'/%3E%3C/svg%3E");
}
.top{display:flex;justify-content:space-between;gap:16px;padding:10px 16px;border-bottom:1px solid var(--ink);background:var(--bench)}
.top b{font-weight:700}
.top i{display:inline-block;width:8px;height:8px;background:var(--org);margin-right:8px;vertical-align:baseline}
#bench{display:flex;justify-content:center;padding:20px 16px 0}
#fit{position:relative}
#rig{position:absolute;left:0;top:0;transform-origin:0 0}
#rig>*{position:absolute}
#glass{background:#000}
#lcd{background:#000;image-rendering:auto}
#chassis{left:0;top:0;user-select:none;-webkit-user-drag:none;pointer-events:none}
.hs{background:transparent;border:0;outline:0;cursor:pointer;touch-action:none;-webkit-tap-highlight-color:transparent}
button.hs.down{background:rgba(0,0,0,.34)}
#stick{left:0;top:0;overflow:visible;touch-action:none}
#stick .hs{fill:rgba(0,0,0,0);cursor:pointer;touch-action:none}
#stick .hs.down{fill:rgba(0,0,0,.32)}
.dot{position:absolute;left:9px;top:50%;width:6px;height:6px;margin-top:-3px;border-radius:50%;pointer-events:none}
.dot.A{background:var(--org)} .dot.B{background:var(--cya)} .dot.C{background:var(--lim)}
#led{border-radius:50%;pointer-events:none}
/* power slide (right edge) */
#pwr{background:#151515;border:1px solid #000;cursor:pointer;touch-action:none}
#pwr .slot{position:absolute;left:5px;top:20px;width:6px;height:36px;background:#000;border:1px solid #4a4a4a}
#pwr .knob{position:absolute;left:-1px;width:6px;height:16px;background:#ECECEC;transition:top 90ms steps(3,end)}
#pwr[aria-checked="true"] .knob{top:1px;border-top:3px solid var(--org)}
#pwr[aria-checked="false"] .knob{top:17px;border-top:0}
#pwr .glyph{position:absolute;left:4px;top:5px;width:8px;height:8px;border:1px solid #ECECEC;border-radius:50%;border-top-color:transparent}
#pwr .glyph:after{content:"";position:absolute;left:2.5px;top:-4px;width:1px;height:5px;background:#ECECEC}
.cap{font-size:7px;line-height:1;letter-spacing:.08em;color:var(--ink);pointer-events:none;white-space:nowrap}
/* 3-way slide (bottom edge) */
#sw{touch-action:none;cursor:pointer}
#sw .track{position:absolute;left:0;top:0;width:150px;height:16px;background:#151515;border:1px solid #000}
#sw .knob{position:absolute;left:2px;top:2px;width:44px;height:10px;background:#ECECEC;transition:transform 90ms steps(4,end)}
#sw .knob:before,#sw .knob:after{content:"";position:absolute;top:2px;bottom:2px;width:1px;background:#8a8a85}
#sw .knob:before{left:17px}#sw .knob:after{left:26px}
#sw .lab{position:absolute;top:20px;font-size:7px;line-height:1;letter-spacing:.08em;white-space:nowrap}
#sw .lab.on{color:var(--org);font-weight:700}
#sw .tick{position:absolute;top:17px;width:1px;height:3px;background:var(--ink)}
.legend{max-width:860px;margin:10px auto 0;padding:0 16px;color:var(--dim);font-size:10px;text-align:center}
.legend b{color:var(--ink);font-weight:700}
#notes{max-width:860px;margin:28px auto 60px;padding:0 16px}
#notes h2{font-size:11px;font-weight:700;border-top:1px solid var(--ink);padding-top:8px;margin-bottom:12px}
#notes h3{font-size:10px;font-weight:700;margin:18px 0 6px;color:var(--ink)}
#notes h3:before{content:"";display:inline-block;width:8px;height:8px;background:var(--org);margin-right:8px}
#notes p,#notes li{color:#333;font-size:10px;line-height:1.7;text-transform:none;letter-spacing:0}
#notes ul{list-style:none}
#notes li:before{content:"— ";color:var(--dim)}
#notes table{border-collapse:collapse;width:100%;font-size:10px;margin:4px 0}
#notes th,#notes td{border:1px solid var(--ink);padding:3px 8px;text-align:left;font-weight:400;background:var(--bench)}
#notes th{font-weight:700}
#notes pre{font:10px/1.6 var(--mono);background:var(--bench);border:1px solid var(--ink);padding:8px 10px;overflow:auto;text-transform:none;letter-spacing:0}
@media (max-width:640px){.top span:nth-child(2){display:none}}
</style>
</head>

<script>
const NOTES_HTML = "<h2>FIELD NOTES // WHAT THIS BUILD ACTUALLY DOES</h2>\n<h3>CHASSIS</h3>\n<ul>\n<li>The body is a real photo of the A2 front panel. Background removed, screen window punched out to a transparent hole.</li>\n<li>The 480x272 canvas sits behind that hole. The hole is 900x516 source px, the LCD is 480x272, so logical pixels map at 1.875 source px each.</li>\n<li>Hotspots (joystick wedges, BACK, A, B, C) sit on top of the photo at measured positions. Pointer, touch and keyboard share one input path.</li>\n<li>The power slide and the LCD / AV-OUT / HOLD slide switch are not in the photo (it is a front view). They are drawn flat, outside the body.</li>\n<li>The photo is 431x252 px upscaled 3x, so metal edges are soft. A higher-resolution front shot drops straight in.</li>\n</ul>\n<h3>AUDIO</h3>\n<table>\n<tr><th>TRACK</th><th>BPM</th><th>BARS</th><th>LENGTH</th><th>ORIGIN</th></tr>\n<tr><td>01 MASTER</td><td>120</td><td>5 x 16 STEPS</td><td>10.00 S CORE X 3 = 30.00 S</td><td>FIXED SEED A2A2</td></tr>\n<tr><td>02 CLONE</td><td>96</td><td>4</td><td>30.00 S</td><td>MASTER + RANDOMISED PARAMS</td></tr>\n<tr><td>03 CLONE</td><td>144</td><td>6</td><td>30.00 S</td><td>MASTER + RANDOMISED PARAMS</td></tr>\n</table>\n<ul>\n<li>Voices: sine kick with pitch drop, sine+triangle sub-bass, white-noise hats through a highpass, noise clap, detuned filtered stabs on a minor pentatonic scale.</li>\n<li>Clones change: root note, tempo, hat and kick pattern, euclidean stab rhythm, waveform, detune, filter cutoff, sweep range and direction, swing.</li>\n<li>Scheduling: a 25 ms timer schedules notes about 200 ms ahead on the audio clock. Track ends are scheduled sample-accurately for loop and next-track.</li>\n<li>Chain: voices, bus, EQ (low shelf, mid peak, high shelf, lowpass), compressor, volume, analysers, speakers.</li>\n</ul>\n<h3>REACTIVITY</h3>\n<ul>\n<li>Every audio visual reads <b>AnalyserNode</b> data: spectrum, tape reels, VU needles, scope, XY, terrain, radio, record input meters, rail volume bar.</li>\n<li>Reels spin at a speed set by live RMS, so they stop when the audio stops. The VU needle is real RMS in dB. Terrain rows are real FFT history.</li>\n<li>Mute, volume, EQ preset, pause and power-off change the analyser signal, so the visuals follow.</li>\n<li>Photo mode is not audio. Its histogram is computed from the pixel buffer drawn above it.</li>\n</ul>\n<h3>CONTROLS</h3>\n<table>\n<tr><th>HARDWARE</th><th>KEY</th><th>ACTION</th></tr>\n<tr><td>JOYSTICK</td><td>ARROWS / ENTER</td><td>NAVIGATE / OK. HOLD LEFT-RIGHT = SEEK</td></tr>\n<tr><td>BACK</td><td>BACKSPACE / ESC</td><td>HOME</td></tr>\n<tr><td>A (ORANGE)</td><td>A</td><td>DSP / EQ PRESET, OR PRIMARY ACTION</td></tr>\n<tr><td>B (CYAN)</td><td>B</td><td>VIEW TOGGLE</td></tr>\n<tr><td>C (LIME)</td><td>C</td><td>LOOP / UTILITY</td></tr>\n<tr><td>POWER SLIDE</td><td>P</td><td>SUSPENDS THE AUDIO CONTEXT</td></tr>\n<tr><td>LCD / AV-OUT / HOLD</td><td>1 / 2 / 3, H</td><td>HOLD BLOCKS ALL KEYS. AV-OUT BLANKS THE LCD</td></tr>\n</table>\n<h3>LIMITS</h3>\n<ul>\n<li>Movie is a live spectral terrain, not video playback.</li>\n<li>Recordings live in memory and clear on reload. MIC is opt-in and never played back through the speakers while recording.</li>\n<li>Radio is three synth stations on a live clock with static between them. It is not real FM.</li>\n<li>Audio needs one click or key press before the browser lets it start.</li>\n</ul>\n";
/* =====================================================================
   AUDIO ENGINE — procedural synth on the Web Audio API
   voices -> bus -> EQ(low/mid/high/lp) -> compressor -> volume -> analysers -> out
   Every visual on the LCD reads from the analysers; nothing is animated on its own.
   ===================================================================== */
const SECTION_SEC = 10, SECTIONS = 3, TRACK_SEC = SECTION_SEC * SECTIONS;
const NOTE_NAMES = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];
const EQ_PRESETS = [
  { n: 'FLAT', low: 0, mid: 0, high: 0, lp: 20000 },
  { n: 'BEAT', low: 9, mid: -2, high: 1.5, lp: 20000 },
  { n: 'AIR', low: -3, mid: 0, high: 8, lp: 20000 },
  { n: 'LOFI', low: 3, mid: 4, high: -12, lp: 2800 },
];
const LOOP_NAMES = ['OFF', 'ONE', 'ALL'];
const SCALE = [0, 3, 5, 7, 10]; // minor pentatonic

function mulberry32(a) {
  return function () {

    if (kind === 'down') { if (k === 'A') { Engine.cycleEQ(); return true; } if (k === 'C') { Engine.cycleLoop(); return true; } }
    return false;
  },
  draw(A) {
    header('SETUP', 'DEVICE + ENGINE'); const rows = this.rows();
    rows.forEach((r, i) => { const y = 24 + i * 17, sel = i === this.sel; if (sel) G.fill(8, y, 360, 15, COL.fg); G.text(r.n, 14, y + 11, sel ? '#000' : COL.fg, { bold: sel }); G.text((r.adj && sel ? '< ' : '') + r.v() + (r.adj && sel ? ' >' : ''), 362, y + 11, sel ? '#000' : COL.dim, { align: 'right' }); });
    const i = Engine.info(), y0 = 120; G.hl(8, y0 - 6, 360, COL.faint); G.text('TELEMETRY', 8, y0 + 3, COL.dim, { bold: true });
    const T = Engine.tracks;
    const lines = [
      'AUDIO CTX  ' + i.state.toUpperCase() + '  SR ' + (i.sr || '---') + 'HZ', 'LATENCY    BASE ' + (i.base * 1000).toFixed(1) + 'MS  OUT ' + (i.out * 1000).toFixed(1) + 'MS',
      'ANALYSERS  MAIN FFT2048 + L/R 1024 + IN L/R 1024', 'SEED       ' + hexSeed() + '  CLONES FROM MASTER A2A2',
    ];
    T.forEach((t, k) => lines.push('TRK 0' + (k + 1) + '     ' + String(t.bpm).padStart(3) + 'BPM  ' + t.bars + ' BARS  ROOT ' + noteName(t.root).padEnd(2) + ' ' + t.p.wave.slice(0, 3).toUpperCase() + '  CUT ' + String(Math.round(t.p.cut)).padStart(4) + '  SWG ' + String(Math.round(t.p.swing * 100)).padStart(2) + '%'));
    lines.forEach((s, k) => G.text(s, 8, y0 + 15 + k * 11, k < 4 ? COL.dim : COL.fg, { size: 7 }));
    rail({ up: 'UP', down: 'DOWN', left: 'DEC', right: 'INC', ok: rows[this.sel].act ? 'GO' : 'OK', back: 'HOME', a: 'DSP ' + EQN(), b: null, c: 'LOOP ' + LOOP_NAMES[ES.loop] });
  },
};

/* ---------------- router ---------------- */
const Screens = {
  list: { launcher: Launcher, music: Music, movie: Movie, photo: Photo, radio: Radio, record: Record, browser: Browser, setup: Setup },
  cur: null,
  go(id) { if (this.cur && this.cur.leave) this.cur.leave(); this.cur = this.list[id]; if (this.cur.enter) this.cur.enter(); },
};

/* =====================================================================
   BOOT
   ===================================================================== */
buildHardware(); wirePointers(); fit(); setSwitch('LCD'); Screens.go('launcher'); Dev.bootAt = performance.now();
window.addEventListener('resize', fit);
// browsers block audio until a gesture: arm it on the first one, anywhere on the page
['pointerdown', 'keydown', 'touchend'].forEach(ev => window.addEventListener(ev, () => Engine.ensure(), { once: false, passive: true }));
requestAnimationFrame(frame);
// test hook, harmless in normal use
window.__a2 = { Engine, Screens, Dev, press, release, setSwitch, setPower, Keys };

document.getElementById('notes').innerHTML = NOTES_HTML;

</script>
